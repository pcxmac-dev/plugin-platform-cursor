[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-cursor"
version = "0.2.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "Cursor for Liminal: Cursor's models through the Cursor SDK, evaluating standardized arguments on your own Cursor API key, with the plans, models and prices written in."
readme = "README.md"
requires-python = ">=3.10"  # the Cursor SDK's own floor, and the library's
# the library it plugs into (the AI assistant kind: liminal_libs.assistants, plugin API 2.2); 1.49.0: its cards
dependencies = ["liminal-libs>=1.49.0"]

[project.optional-dependencies]
# the Cursor SDK: what reaches Cursor (its wheel carries the bridge, cursor-sdk-bridge, which the plugin starts
# windowless for a call and stops after it); the plugin loads, sets up and is tested without it
sdk = ["cursor-sdk>=1.0.40,<2"]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
cursor = "plugin_platform_cursor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
